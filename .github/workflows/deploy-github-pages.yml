name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Export static site
        working-directory: source
        run: npx next build
        env:
          GITHUB_PAGES: "true"

      - name: Prefix public asset paths
        working-directory: source
        run: |
          node scripts/postprocess-static-export.mjs out
          touch out/.nojekyll

      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: agent/github-pages-export
          path: published

      - name: Publish static export
        working-directory: published
        run: |
          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../source/out/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No publishing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish GitHub Pages from ${GITHUB_SHA}"
          git push origin HEAD:agent/github-pages-export
