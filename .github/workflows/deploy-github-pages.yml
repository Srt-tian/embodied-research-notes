name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Export static site
        working-directory: source
        run: npx next build
        env:
          GITHUB_PAGES: "true"

      - name: Prefix public asset paths
        working-directory: source
        run: |
          node scripts/postprocess-static-export.mjs out
          touch out/.nojekyll

      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: agent/github-pages-export
          path: published

      - name: Update publishing branch
        working-directory: published
        run: |
          git rm -r --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../source/out/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No publishing changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish GitHub Pages from ${GITHUB_SHA}"
            git push origin HEAD:agent/github-pages-export
          fi

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response="$(gh api --include --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" 2>&1)"
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            printf '%s\n' "${response}" > published/.pages-build-error.log
            cd published
            git add .pages-build-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Pages build request failure"
            git push origin HEAD:agent/github-pages-export
            exit "${status}"
          fi
          printf '%s\n' "${response}"
