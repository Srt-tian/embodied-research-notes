name: Validate static export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export static site
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/embodied-research-notes"

      - name: Validate exported paths
        run: |
          node scripts/postprocess-static-export.mjs out
          test -f out/notes/masquerade/index.html
          test -f out/.nojekyll || touch out/.nojekyll
